<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Central Intelligence Hub — Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#111}
    body{margin:20px;background:#f4f6f8}
    header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
    .logo{width:48px;height:48px;background:#1f6feb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
    h1{font-size:20px;margin:0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:12px}
    .card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 6px 18px rgba(20,30,50,0.06)}
    .big{font-size:28px;font-weight:700}
    .label{color:#556;font-size:13px}
    .row{display:flex;gap:12px;align-items:center}
    .chart{height:80px;margin-top:10px}
    button{background:#1f6feb;color:#fff;border:none;padding:8px 12px;border-radius:8px;cursor:pointer}
    pre{white-space:pre-wrap;font-family:inherit;background:#fafafa;padding:12px;border-radius:8px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="logo">CI</div>
    <div>
      <h1>Central Intelligence Hub</h1>
      <div style="color:#556;font-size:13px">Customer insights dashboard (prototype)</div>
    </div>
    <div style="margin-left:auto">
      <button onclick="loadData()">Load Insights</button>
    </div>
  </header>

  <section class="grid">
    <div class="card">
      <div class="label">Net Promoter Score (NPS)</div>
      <div id="nps" class="big">—</div>
    </div>
    <div class="card">
      <div class="label">Total Sales Volume</div>
      <div id="sales" class="big">—</div>
    </div>
    <div class="card">
      <div class="label">POC Feedback (short)</div>
      <div id="feedback" style="margin-top:8px;color:#333">—</div>
    </div>
  </section>

  <section style="margin-top:16px" class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>Monthly Sales</strong></div>
      <div style="color:#556;font-size:13px">Last 12 months</div>
    </div>
    <svg id="bar" class="chart" width="100%" height="80"></svg>
  </section>

  <section style="margin-top:14px" class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <div><strong>Raw JSON</strong></div>
      <div style="color:#556;font-size:13px">For reviewers</div>
    </div>
    <pre id="raw">No data loaded</pre>
  </section>

  <script>
    function loadData(){
      fetch("http://127.0.0.1:8000/insights")
      .then(r=>r.json())
      .then(data=>{
        document.getElementById('nps').textContent = data.nps ?? '—'
        document.getElementById('sales').textContent = data.sales_volume ?? '—'
        document.getElementById('feedback').textContent = data.poc_feedback ?? '—'
        document.getElementById('raw').textContent = JSON.stringify(data,null,2)
        drawBar(data.monthly_sales || [])
      })
      .catch(e=>{
        document.getElementById('raw').textContent = 'Error: ' + (e.message || e)
      })
    }

    function drawBar(values){
      const svg = document.getElementById('bar')
      while(svg.firstChild) svg.removeChild(svg.firstChild)
      if(!values.length) return
      const w = svg.clientWidth, h = svg.clientHeight, pad = 6
      const max = Math.max(...values)
      const bw = (w - pad*2) / values.length
      values.forEach((v,i)=>{
        const vh = (v / max) * (h - 20)
        const rect = document.createElementNS('http://www.w3.org/2000/svg','rect')
        rect.setAttribute('x', pad + i*bw + 4)
        rect.setAttribute('y', h - vh - 10)
        rect.setAttribute('width', Math.max(6, bw - 8))
        rect.setAttribute('height', vh)
        rect.setAttribute('fill', '#1f6feb')
        svg.appendChild(rect)
      })
    }
  </script>
</body>
</html>
